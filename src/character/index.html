<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>balBul</title>
  <link rel="stylesheet" href="character.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden">
      <div id="bubble-text"></div>
      <form id="bubble-reply" class="hidden"><input id="bubble-reply-input" maxlength="4000" placeholder="Balas pesan..." autocomplete="off"><button type="submit" aria-label="Kirim balasan">➤</button></form>
      <div id="bubble-actions" class="hidden">
        <button id="btn-done" type="button">Selesai</button>
        <button id="btn-snooze" type="button">Tunda 10 mnt</button>
      </div>
    </div>
    <div id="char-wrap">
      <div id="body">
        <img id="char" src="../../assets/sprites/idle.png" draggable="false" alt="balBul">
        <div class="eye" id="eye-0"></div>
        <div class="eye" id="eye-1"></div>
      </div>
    </div>
  </div>
  <script src="../color.js"></script>
  <script src="eyes-data.js"></script>
  <script src="character.js"></script>
</body>
</html>
