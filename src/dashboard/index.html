<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://esm.sh; connect-src 'self' https://okdckmorwoihndvzmhsx.supabase.co wss://okdckmorwoihndvzmhsx.supabase.co">
  <title>balBul</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <img src="../../assets/sprites/idle.png" alt="" class="brand-img">
      <div>
        <div class="brand-name">balBul</div>
        <div class="brand-sub">Desktop Assistant</div>
      </div>
    </div>
    <nav id="nav">
      <button data-view="today" class="active" type="button">Tugas Hari Ini</button>
      <button data-view="all" type="button">Semua Tugas</button>
      <button data-view="done" type="button">Selesai</button>
      <button data-view="settings" type="button">Pengaturan</button>
    </nav>
    <img id="side-sprite" src="../../assets/sprites/idle.png" alt="" class="side-sprite">
  </aside>

  <section id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <img src="../../assets/sprites/idle.png" alt="" class="auth-mascot">
      <div class="auth-brand">balBul</div>
      <h1 id="auth-title">Selamat datang kembali!</h1>
      <p class="auth-lead">Masuk untuk menyinkronkan ruang produktifmu.</p>
      <form id="auth-form" autocomplete="on">
        <label id="auth-name-wrap" class="hidden">Nama tampilan<input id="auth-name" type="text" maxlength="40" placeholder="Nama kamu" autocomplete="name"></label>
        <label>Email<input id="auth-email" type="email" required autocomplete="email" placeholder="nama@email.com"></label>
        <label>Password<input id="auth-password" type="password" required minlength="8" autocomplete="current-password" placeholder="Minimal 8 karakter"></label>
        <p id="auth-message" class="auth-message" aria-live="polite"></p>
        <button id="auth-submit" class="add-btn" type="submit">Masuk ke balBul</button>
      </form>
      <div class="auth-links">
        <button id="auth-toggle" class="text-btn" type="button">Belum punya akun? Daftar</button>
        <button id="auth-forgot" class="text-btn" type="button">Lupa password?</button>
      </div>
      <p class="auth-foot">Akun balBul · Email wajib diverifikasi</p>
    </div>
  </section>

  <div id="app-shell" class="app-shell hidden">
    <main id="main"></main>
    <footer class="account-bar"><span id="account-label">Belum masuk</span><button id="auth-signout" class="text-btn" type="button">Keluar akun</button></footer>
  </div>

  <dialog id="dlg">
    <form id="form" autocomplete="off">
      <h2 id="form-title">Tambah Tugas</h2>

      <div class="seg" id="seg">
        <button type="button" data-kind="task" class="on">Tugas (ada deadline)</button>
        <button type="button" data-kind="reminder">Pengingat biasa</button>
      </div>
      <p id="kind-hint" class="hint"></p>

      <label>Judul
        <input id="f-title" type="text" maxlength="200" required placeholder="Contoh: Edit video promosi">
      </label>

      <label>Catatan (opsional)
        <textarea id="f-desc" rows="2" maxlength="2000"></textarea>
      </label>

      <label>Prioritas
        <select id="f-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </label>

      <!-- khusus TUGAS -->
      <div class="group only-task">
        <label>Deadline (opsional)
          <input id="f-deadline" type="datetime-local">
        </label>

        <label>Ingatkan saya
          <select id="f-remind">
            <option value="none">Tidak usah</option>
            <option value="0">Tepat saat deadline</option>
            <option value="10">10 menit sebelumnya</option>
            <option value="30">30 menit sebelumnya</option>
            <option value="60">1 jam sebelumnya</option>
            <option value="1440">1 hari sebelumnya</option>
            <option value="custom">Pilih waktu sendiri...</option>
          </select>
        </label>

        <label id="custom-wrap" class="hidden">Waktu pengingat
          <input id="f-custom" type="datetime-local">
        </label>
      </div>

      <!-- khusus PENGINGAT BIASA -->
      <div class="group only-reminder hidden">
        <label>Ingatkan pada
          <input id="f-rtime" type="datetime-local">
        </label>

        <label>Ulangi
          <select id="f-repeat">
            <option value="none">Sekali saja</option>
            <option value="daily">Setiap hari</option>
            <option value="weekdays">Hari kerja (Senin-Jumat)</option>
            <option value="weekly">Setiap minggu</option>
          </select>
        </label>
      </div>

      <p id="form-error" class="error hidden"></p>

      <div class="actions">
        <button type="button" id="btn-cancel" class="ghost">Batal</button>
        <button type="submit" class="primary">Simpan</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
