name: Build balBul Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $v"
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund } else { npm install --no-audit --no-fund }
      - name: Verify updater is a production dependency
        run: |
          npm ls electron-updater --omit=dev
          node -e "const p=require('./node_modules/electron-updater/package.json'); console.log('electron-updater production dependency:', p.version)"
      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish never
      - name: Verify packaged updater dependency
        shell: pwsh
        run: |
          $asar = "dist/win-unpacked/resources/app.asar"
          if (!(Test-Path $asar)) { throw "app.asar not found: $asar" }
          npx --yes @electron/asar list $asar | Select-String "node_modules/electron-updater/package.json"
          if ($LASTEXITCODE -ne 0) { throw "electron-updater package is missing from app.asar" }
      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (!(Test-Path "dist/latest.yml")) { throw "dist/latest.yml missing" }
          if (!(Get-ChildItem "dist" -Filter "*.blockmap")) { throw "blockmap missing" }
          Get-Content "dist/latest.yml"
      - name: Upload installer and updater metadata
        uses: actions/upload-artifact@v4
        with:
          name: balBul-Windows-Installer-v${{ steps.ver.outputs.version }}
          path: |
            dist/balBul-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Check whether this version is already released
        id: rel
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0
      - name: Skip notice (release already exists)
        if: steps.rel.outputs.exists == 'true'
        shell: pwsh
        run: Write-Host "Release v${{ steps.ver.outputs.version }} sudah ada, tidak ditimpa. Naikkan 'version' di package.json untuk merilis versi baru."
      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: balBul v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/balBul-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true

  build-mac:
    # Installer Mac (.dmg) dibuat setelah job Windows selesai, lalu ditempel ke rilis yang sama.
    # Belum ditandatangani Apple: saat pertama dibuka, klik kanan -> Open.
    needs: build-windows
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build macOS installers (arm64 + x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --publish never
      - name: List build output
        run: ls -la dist
      - name: Upload macOS installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: balBul-macOS-v${{ steps.ver.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Attach to release (only files not yet on it)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG belum ada, lewati."; exit 0
          fi
          for f in dist/*.dmg; do
            name=$(basename "$f")
            if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "$name sudah ada di release, tidak ditimpa."
            else
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}"
            fi
          done
