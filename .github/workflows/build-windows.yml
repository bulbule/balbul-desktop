name: Build balBul Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "assets/**"
      - ".github/workflows/build-windows.yml"
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: balBul-Windows-Installer
          path: |
            dist/balBul-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish balBul v1.0.1 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: balBul v1.0.1
          generate_release_notes: true
          files: |
            dist/balBul-Setup.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
