name: Publish balBul Windows Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows installer artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/bulbule/balbul-desktop/actions/artifacts/14659306847/zip" \
            -o installer-artifact.zip
          unzip -o installer-artifact.zip -d extracted
          installer="$(find extracted -type f -iname 'balBul-Setup.exe' -print -quit)"
          test -n "$installer"
          cp "$installer" release-assets/balBul-Setup.exe
          test -s release-assets/balBul-Setup.exe
          ls -lh release-assets/balBul-Setup.exe

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: 73f2b66341700d5f2faa2afa735b10b6ec5cd446
          name: balBul v1.0.0
          body: |
            balBul desktop assistant for Windows 10/11 (64-bit).

            - Windows x64 NSIS installer
            - Friend system, realtime chat, shared task and sync features included in this build
            - Install and sign in with your balBul account
          files: release-assets/balBul-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
